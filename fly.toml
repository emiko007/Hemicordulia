[app]
  primary_region = "iad"
  kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  FRONTEND_URL = "https://hemicord-ai.web.app"
  FIREBASE_PROJECT_ID = "hemicord-ai"
  FIREBASE_CLIENT_EMAIL = "firebase-adminsdk-fbsvc@hemicord-ai.iam.gserviceaccount.com"
  FIREBASE_DATABASE_URL = "https://hemicord-ai.firebaseio.com"

[[services]]
  protocol = "tcp"
  internal_port = 3001
  processes = ["app"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "1m"
